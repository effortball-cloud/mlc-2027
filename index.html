<style>
:root{--bg:#f1f4f2;--card:#fff;--ink:#13272c;--muted:#58696b;--line:#d7e0dc;--sea:#0b6874;--bad:#b3372f}
@media (prefers-color-scheme:dark){:root{--bg:#0b1518;--card:#122126;--ink:#e3edeb;--muted:#93a7a6;--line:#24383d;--sea:#55b6c1;--bad:#f17d73;color-scheme:dark}}
html,body{margin:0;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
#lk{position:fixed;inset:0;z-index:99999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;transition:opacity .25s}
#lk.out{opacity:0;pointer-events:none}
#lk .c{width:100%;max-width:340px;text-align:center}
#lk h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:48px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1}
#lk h1 em{font-style:normal;color:var(--sea)}
#lk p{color:var(--muted);margin:10px 0 22px;font-size:14px}
#lk .pw{position:relative}
#lk input[type=password],#lk input[type=text]{width:100%;box-sizing:border-box;padding:15px 52px 15px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;text-align:center;outline:none}
#lk input:focus{border-color:var(--sea)}
#lk .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;font-size:13px;color:var(--muted)}
#lk .go{width:100%;margin-top:12px;padding:15px;min-height:52px;border-radius:12px;border:0;background:var(--sea);color:var(--card);font-size:17px;font-weight:700}
#lk .go:disabled{opacity:.6}
#lk label{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px;font-size:14px;color:var(--muted);min-height:36px}
#lk label input{width:20px;height:20px;accent-color:var(--sea)}
#lk .e{color:var(--bad);min-height:22px;margin-top:12px;font-size:15px;font-weight:600}
#lk .hint{margin-top:18px;font-size:12.5px;color:var(--muted);line-height:1.5}
#lk .spin{width:36px;height:36px;margin:18px auto 10px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--sea);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div id="lk">

    <button type="submit" class="go" id="go">열기</button>

  </form>
</div>
